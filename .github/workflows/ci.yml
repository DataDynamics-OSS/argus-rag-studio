name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 ref 의 이전 실행은 취소 (PR push 시 중복 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-versions.sh 의 릴리스 태그 확인용
      - name: Check component versions match backend/app/__init__.py
        run: scripts/check-versions.sh

  backend:
    name: Backend (lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        # 포맷 검사(ruff format --check)는 CI 게이트에서 제외 — 로컬 `make format` 으로 관리.
        run: ruff check app/ tests/

      - name: Test (pytest)
        # 외부 인프라(PostgreSQL/MinIO) 없이 도는 테스트만 유지한다.
        # 네이티브 확장(rhwp_py) 미설치 케이스는 테스트가 자체적으로 skip 한다.
        run: pytest tests/ -v

  frontend:
    name: Frontend (lint, typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  agent:
    name: Agent (lint & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/

      - name: Test (pytest)
        run: pytest tests/ -v
