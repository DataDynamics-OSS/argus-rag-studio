# RAG Studio Server configuration
server.host=0.0.0.0
server.port=4700

# Logging (개발용 — backend/ 기준 상대 경로. 패키징 배포는 deploy/config 의 /var/log 절대 경로 사용)
log.level=INFO
log.dir=logs
log.filename=argus-rag-studio-server.log

# CORS
cors.origins=*

# 인증 — local(기본) 또는 keycloak
auth.type=local
auth.keycloak.server_url=http://localhost:8180
auth.keycloak.realm=argus
auth.keycloak.client_id=argus-client
auth.keycloak.client_secret=argus-client-secret
auth.keycloak.admin_role=argus-admin
auth.keycloak.superuser_role=argus-superuser
auth.keycloak.user_role=argus-user

# Data (개발용 — backend/ 기준 상대 경로)
data.dir=data

# Database
db.type=postgresql
db.host=localhost
db.port=5432
db.name=argus_rag_studio
db.username=argus
db.password=argus

# Platform / 기반 환경 — standard | databricks
#   databricks 선택 시 임베딩/LLM/벡터스토어/스토리지의 기본값·동작이 Databricks 규약에 맞춰진다.
#   (sidebar > 설정 에서 전환 가능. 전환은 신규 컬렉션 기본값에만 영향 — 기존 컬렉션은 모델 고정)
platform.base=standard
# Databricks workspace (기반 환경=databricks 일 때). PAT 토큰 인증.
databricks.host=
databricks.token=

# Embedding defaults (컬렉션 생성 기본값)
embedding.default_model=bge-m3
embedding.default_dim=1024
embedding.default_metric=cosine

# Embedding provider (M2 인제스천 청크 임베딩)
#   provider=openai_compatible 면 server_url 의 /embeddings 를 호출(TEI/Ollama-proxy/vLLM/OpenAI)
#   provider=hash 면 외부 서버 없이 결정적 더미 벡터 생성(개발/오프라인/에어갭)
embedding.provider=openai_compatible
embedding.server_url=http://localhost:8080/v1
# Argus 임베딩 서버 기본 키와 동일(EMBED_API_KEY). 무인증 서버면 빈값으로
embedding.api_key=changeme
embedding.model=bge-m3
# 쿼리 instruction(선택) — instruction-aware 임베딩(Qwen3-Embedding 등)에서 쿼리에만 붙는 지시문.
#   빈값이면 기반 환경 프로파일 기본값을 따른다(standard=없음, databricks=Qwen 기본 지시문).
embedding.query_instruction=
embedding.batch_size=32
# 인증 헤더 커스터마이즈 — 기본 'Authorization: Bearer'. X-API-Key 게이트웨이면
#   embedding.auth_header=X-API-Key, embedding.auth_scheme=  (빈값)
embedding.auth_header=Authorization
embedding.auth_scheme=Bearer

# Ingestion (M2)
ingestion.chunk_size=1000
ingestion.chunk_overlap=150
ingestion.local_worker_enabled=false
ingestion.worker_interval=2.0

# Retrieval (M3) — hybrid search
retrieval.top_k=5
# 벡터 저장/검색 백엔드 — pgvector(기본) | qdrant | weaviate | milvus | databricks
retrieval.vector_store=pgvector
# Databricks Mosaic AI Vector Search 전용(인증은 databricks.host/token 재사용)
#   endpoint: Vector Search 엔드포인트(컴퓨트) 이름. 인덱스 위치: {catalog}.{schema}.{prefix}_c{id}
retrieval.vector_store_databricks_endpoint=
retrieval.vector_store_databricks_catalog=main
retrieval.vector_store_databricks_schema=argus

# LLM (M3) — provider: openai_compatible | anthropic
#   openai_compatible: server_url 의 /chat/completions 호출 (사내 192.0.2.50:8080 등)
#   anthropic: Claude (anthropic SDK). 모델 미지정 시 claude-opus-4-8.
llm.provider=openai_compatible
llm.server_url=http://localhost:8080/v1
llm.model=
llm.max_tokens=2048
llm.temperature=0.2
# 인증 헤더 커스터마이즈 — 기본 'Authorization: Bearer'. X-API-Key 게이트웨이면
#   llm.auth_header=X-API-Key, llm.auth_scheme=  (빈값)
llm.auth_header=Authorization
llm.auth_scheme=Bearer

# Rerank (M3) — none | llm | cross_encoder
rerank.provider=none
# cross_encoder 일 때 리랭커 서버 주소 + 키(Argus 리랭커 서버 기본 키와 동일)
rerank.server_url=http://localhost:8081/rerank
rerank.api_key=changeme
# 인증 헤더 커스터마이즈 — 기본 'Authorization: Bearer'.
rerank.auth_header=Authorization
rerank.auth_scheme=Bearer

# Detection — 어노테이션 자동 bbox 인식(PaddleOCR 검출 서버, detection_server/)
#   detection.enabled : true 면 편집기 '자동 인식' 활성화
#   detection.api_key : Argus 검출 서버 기본 키와 동일(무인증이면 빈값)
detection.enabled=true
detection.server_url=http://localhost:8082
detection.api_key=changeme
detection.auth_header=Authorization
detection.auth_scheme=Bearer
detection.lang=korean
detection.min_score=0.5
detection.timeout=60

# HWP/HWPX 페이지 렌더 서비스(헤드리스 @rhwp/core) — 검색 근거 페이지 보기
hwp_render.url=http://localhost:8085

# 에이전트(Argus RAG Studio Agent) 하트비트 끊김 감시
#   heartbeat_check_interval     : 점검 주기(초)
#   heartbeat_disconnect_timeout : 이 시간(초) 넘게 무소식이면 DISCONNECTED 표시
agent.heartbeat_check_interval=30
agent.heartbeat_disconnect_timeout=120

# 에이전트 Docker 배포 — 이미지 레지스트리/태그 기본값 (registry 비면 로컬/Docker Hub)
deploy.image_registry=
deploy.image_tag=latest
# arm64(aarch64) 호스트의 vLLM 이미지 — 공식 이미지는 x86 전용. 에어갭은 zot 미러 주소로.
deploy.vlm_image_arm64=nvcr.io/nvidia/vllm:26.02-py3

# 소스 워치(자동 수집 — design/source-watch.md)
storage_sources.watch_enabled=true
storage_sources.watch_tick_seconds=15
storage_sources.watch_min_interval_seconds=60
storage_sources.watch_runs_keep=100
storage_sources.seen_prune_days=30
