[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-rag-studio-server"
# 버전 단일 소스: app/__init__.py 의 __version__ 에서 동적으로 가져온다.
dynamic = ["version"]
description = "Argus RAG Studio Server - Retrieval-Augmented Generation platform"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "aiomysql>=0.2.0",
    "email-validator>=2.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27",
    "cachetools>=5.3",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "pgvector>=0.2.5",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "mammoth>=1.6",
    "pyarrow>=14.0",
    "olefile>=0.47",
    "anthropic>=0.40",
    "pillow>=10.0",
    "kubernetes-asyncio>=30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3.0",
    "aiosqlite>=0.20",
    "pymupdf>=1.24",   # vlm 파서 테스트(페이지 래스터화). 없으면 vlm 테스트 skip
    "reportlab>=4.0",  # tests/fixtures/table.pdf 재생성용(테스트 실행엔 불필요 — 픽스처 커밋됨)
]
# 기반 환경=databricks 의 벡터스토어(Mosaic AI Vector Search) + 스토리지(Unity Catalog Volumes).
# lazy import — 미설치 시 해당 백엔드만 비활성.
databricks = [
    "databricks-vectorsearch>=0.40",
    "databricks-sdk>=0.30",
]

[project.scripts]
argus-rag-studio-server = "app.main:run"

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# E501(라인 길이)은 대부분 한국어 주석/문자열이라 무시. E741(모호한 변수명)은 스타일 선호로 비활성화.
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]  # 미들웨어 등록 후 라우터 import (의도적 지연 import)

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
