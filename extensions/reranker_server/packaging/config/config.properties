# Argus Reranker Server configuration
server.host=0.0.0.0
server.port=8081

# Logging (개발용 — reranker_server/ 기준 상대 경로. 패키징 배포는 /var/log 절대 경로 사용)
log.level=INFO
log.dir=logs
log.filename=argus-reranker-server.log

# Rerank
#   rerank.api_key : 인증 키(Authorization: Bearer). 빈값이면 무인증. RAG rerank.api_key 와 동일
#   rerank.models  : 노출 모델 화이트리스트(콤마구분). 비면 FastEmbed 전체 cross-encoder
rerank.api_key=changeme
rerank.default_model=Xenova/ms-marco-MiniLM-L-6-v2
rerank.models=
rerank.cache_dir=
rerank.preload=false
rerank.max_batch=256
