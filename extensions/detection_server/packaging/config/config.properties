# Argus Detection Server configuration
server.host=0.0.0.0
server.port=8082

# Logging (개발용 — detection_server/ 기준 상대 경로. 패키징 배포는 /var/log 절대 경로 사용)
log.level=INFO
log.dir=logs
log.filename=argus-detection-server.log

# Detection (PaddleOCR)
#   detect.api_key   : 인증 키(Authorization: Bearer). 빈값이면 무인증
#   detect.lang      : PaddleOCR 언어 코드(korean/en/ch/japan ...)
#   detect.use_gpu   : GPU 사용 여부(별도 paddlepaddle-gpu 필요)
#   detect.min_score : 신뢰도 임계값(이 미만 박스 제외)
detect.api_key=changeme
# engine: paddleocr(CPU 기본) | easyocr(torch GPU)
detect.engine=paddleocr
detect.lang=korean
detect.easyocr_langs=ko,en
detect.use_gpu=false
detect.min_score=0.5
detect.max_image_mb=20
detect.preload=false
