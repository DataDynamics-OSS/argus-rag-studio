[defaults]
inventory            = inventories/sample/hosts.yml
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
# ansible-core 2.13+ : 별도 'yaml' 콜백 대신 기본 콜백 + YAML 결과 포맷 사용
# (community.general.yaml 콜백은 12.0.0 에서 제거됨)
stdout_callback        = default
callback_result_format = yaml
deprecation_warnings = False
interpreter_python   = auto_silent
forks                = 10

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30

[privilege_escalation]
become        = True
become_method = sudo
