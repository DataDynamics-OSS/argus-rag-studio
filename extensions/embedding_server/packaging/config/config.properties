# Argus Embedding Server configuration
server.host=0.0.0.0
server.port=8080

# Logging (개발용 — embedding_server/ 기준 상대 경로. 패키징 배포는 /var/log 절대 경로 사용)
log.level=INFO
log.dir=logs
log.filename=argus-embedding-server.log

# Embedding
#   embed.api_key : 인증 키(Authorization: Bearer). 빈값이면 무인증
#   embed.dim     : 노출 모델을 이 차원으로 필터(빈값이면 전체). RAG vector(1024) 에 맞춤
#   embed.models  : 노출 모델 화이트리스트(콤마구분). 설정 시 embed.dim 보다 우선
embed.api_key=changeme
embed.default_model=mixedbread-ai/mxbai-embed-large-v1
embed.dim=1024
embed.models=
embed.cache_dir=
embed.preload=false
embed.max_batch=256
