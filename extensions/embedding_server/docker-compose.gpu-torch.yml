# Argus 임베딩 서버(GPU, torch 백엔드) — sentence-transformers(torch cu128) GPU 배포.
# 사용: cd embedding_server && docker compose -f docker-compose.gpu-torch.yml up -d --build
# 요구: 호스트 NVIDIA 드라이버 + nvidia-container-runtime (`--gpus all`).
#   aarch64 + Blackwell(GB10/sm_121)에서 GPU 동작. onnxruntime-gpu 불가 환경의 대안.
services:
  embedding-server:
    build:
      context: .
      dockerfile: Dockerfile.gpu-torch
    image: argus-rag-studio-embedding-server:latest-gpu-torch
    container_name: argus-embedding-server
    ports:
      - "8090:8080"                # 호스트 8080 이 점유된 경우 대비(필요시 조정)
    environment:
      EMBED_API_KEY: "changeme"
      EMBED_BACKEND: "sentence_transformers"
      EMBED_DEVICE: "cuda"
      EMBED_PRELOAD: "true"
      EMBED_DEFAULT_MODEL: "mixedbread-ai/mxbai-embed-large-v1"   # 1024차원
      EMBED_MODELS: "mixedbread-ai/mxbai-embed-large-v1,intfloat/multilingual-e5-large,BAAI/bge-m3,BAAI/bge-large-en-v1.5"
      EMBED_MAX_BATCH: "128"
      EMBED_LOG_DIR: "/var/log/argus-embedding-server"
      # 레지스트리 하트비트(선택) — LB 뒤 레플리카까지 모니터링. 배포 시 셸/.env 로 주입:
      #   ARGUS_HEARTBEAT_URL=http://<rag-backend>:4700/api/v1/ext-servers/heartbeat
      #   ARGUS_INSTANCE_URL=http://<this-host>:8090   (미설정이면 하트비트 비활성)
      ARGUS_HEARTBEAT_URL: "${ARGUS_HEARTBEAT_URL:-}"
      ARGUS_INSTANCE_URL: "${ARGUS_INSTANCE_URL:-}"
      ARGUS_HEARTBEAT_TOKEN: "${ARGUS_HEARTBEAT_TOKEN:-}"
      ARGUS_HEARTBEAT_INTERVAL: "${ARGUS_HEARTBEAT_INTERVAL:-10}"
    gpus: all                      # 모든 GPU 노출(docker compose v2.30+)
    volumes:
      - embed-models:/models       # HF 모델 캐시 유지
      - embed-logs:/var/log/argus-embedding-server
    restart: unless-stopped

volumes:
  embed-models:
  embed-logs:
